name: Android Build & Deploy

on:
  push:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  JAVA_VERSION: "17"
  JAVA_DISTRIBUTION: "temurin"

jobs:
  build-dev:
    name: Build Dev
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build dev debug APK
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew assembleDevDebug

      - name: Build dev release APK
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew assembleDevRelease

      - name: Upload dev debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-dev-debug
          path: app/build/outputs/apk/dev/debug/app-dev-debug.apk
          retention-days: 30

      - name: Upload dev release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-dev-release
          path: app/build/outputs/apk/dev/release/app-dev-release.apk
          retention-days: 30

  build-prod:
    name: Build Prod Release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode signing key
        if: env.SIGNING_KEY != ''
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: echo "$SIGNING_KEY" | base64 -d > app/release-keystore.jks

      - name: Build prod release AAB
        env:
          VERSION_CODE: ${{ github.run_number }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_STORE_FILE: release-keystore.jks
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: ./gradlew bundleProdRelease

      - name: Build prod release APK
        env:
          VERSION_CODE: ${{ github.run_number }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_STORE_FILE: release-keystore.jks
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: ./gradlew assembleProdRelease

      - name: Upload prod AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-prod-release-aab
          path: app/build/outputs/bundle/prodRelease/app-prod-release.aab
          retention-days: 90

      - name: Upload prod APK
        uses: actions/upload-artifact@v4
        with:
          name: app-prod-release-apk
          path: app/build/outputs/apk/prod/release/app-prod-release.apk
          retention-days: 90

      - name: Clean up signing key
        if: always()
        run: rm -f app/release-keystore.jks
